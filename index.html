<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
body{margin:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
</style>
<title>Rooted Arabic</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F0E6; --surface:#FFFFFF; --surface-2:#FBF9F2;
  --ink:#1E2438; --ink-soft:#565C74; --ink-faint:#8B8FA3;
  --gold:#A8781F; --gold-soft:#E7D9B8; --teal:#1F6F6B; --teal-soft:#D7E9E6;
  --rose:#AD4438; --rose-soft:#F1DAD4; --border:#DDD8C8;
  --shadow: 0 10px 30px -12px rgba(30,36,56,0.18);
  --radius:16px; --radius-sm:10px;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151F; --surface:#1D1F2E; --surface-2:#20222F;
    --ink:#EDEAE0; --ink-soft:#A6AABF; --ink-faint:#6E7188;
    --gold:#DCAF52; --gold-soft:#3A3320; --teal:#5BC2BA; --teal-soft:#1C3230;
    --rose:#E08277; --rose-soft:#3A211E; --border:#33364A;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14151F; --surface:#1D1F2E; --surface-2:#20222F;
  --ink:#EDEAE0; --ink-soft:#A6AABF; --ink-faint:#6E7188;
  --gold:#DCAF52; --gold-soft:#3A3320; --teal:#5BC2BA; --teal-soft:#1C3230;
  --rose:#E08277; --rose-soft:#3A211E; --border:#33364A;
  --shadow: 0 10px 30px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Karla',system-ui,-apple-system,sans-serif;
  padding-inline:0; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}
.ar{font-family:'Noto Naskh Arabic','Amiri',serif; direction:rtl; unicode-bidi:isolate;}
.ar-display{font-family:'Amiri',serif; direction:rtl;}
.ar-ui{font-family:'Noto Sans Arabic',sans-serif; direction:rtl; unicode-bidi:isolate;}
button{font-family:inherit; cursor:pointer;}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

/* ---------- shell ---------- */
#shell{max-width:760px; margin:0 auto; padding-inline:16px; padding-bottom:96px;}
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--gold) 7%, transparent) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--gold) 7%, transparent) 0 1px, transparent 1px 22px),
    var(--bg);
  border-bottom:1px solid var(--border);
}
.top-inner{max-width:760px; margin:0 auto; padding:14px 16px 0;}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--bg);
  display:flex; align-items:center; justify-content:center; font-family:'Amiri',serif; font-size:19px; flex:none;
}
.brand h1{font-size:19px; font-weight:600; letter-spacing:.2px;}
.chips{display:flex; gap:8px; flex:none;}
.chip{
  display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:5px 10px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;
}
nav.tabs{display:flex; gap:4px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  background:none; border:none; color:var(--ink-soft); font-weight:600; font-size:14px;
  padding:9px 12px 12px; border-bottom:3px solid transparent; white-space:nowrap;
}
nav.tabs button.active{color:var(--ink); border-bottom-color:var(--gold);}

main{padding-top:18px; display:flex; flex-direction:column; gap:16px;}

/* ---------- primitives ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px;
}
.card + .card{margin-top:0;}
.hero{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); font-weight:700;}
.muted{color:var(--ink-soft);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  font-weight:600; font-size:14px; padding:10px 18px;
}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.45;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.grid{display:grid; gap:10px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:520px){ .grid.cols-4{grid-template-columns:repeat(3,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;}
.pill.new{background:var(--gold-soft); color:var(--gold);}
.pill.learning{background:var(--teal-soft); color:var(--teal);}
.pill.mastered{background:var(--ink); color:var(--bg);}
.section-title{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px;}
.section-title h2{font-size:20px;}
hr.thin{border:none; border-top:1px solid var(--border); margin:14px 0;}
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; color:var(--ink);
}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:80; box-shadow:var(--shadow);}

/* ---------- program roadmap ---------- */
.roadmap{display:flex; flex-direction:column;}
.phase-row{display:flex; gap:12px; padding:14px 0; position:relative;}
.phase-row + .phase-row{border-top:1px solid var(--border);}
.phase-num{width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:14px; flex:none;}
.phase-row.done .phase-num{background:var(--teal); border-color:var(--teal); color:#fff;}
.phase-row.current .phase-num{background:var(--gold); border-color:var(--gold); color:#fff;}
.phase-body{flex:1; min-width:0;}
.phase-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.phase-head h3{font-size:15.5px;}
.phase-week{font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; flex:none;}
.phase-desc{font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
.phase-target{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
.here-badge{display:inline-block; font-size:10.5px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.05em; margin-left:6px;}

/* ---------- dashboard ---------- */
.stat-tile{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; text-align:center;}
.stat-tile .num{font-family:'Fraunces',serif; font-size:22px; font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
.streak-row{display:flex; gap:6px; margin-top:10px;}
.streak-dot{width:22px; height:22px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-faint);}
.streak-dot.on{background:var(--gold); border-color:var(--gold); color:#fff;}
details.about summary{cursor:pointer; font-weight:600; font-size:14px; color:var(--ink-soft); list-style:none;}
details.about summary::-webkit-details-marker{display:none;}
details.about summary::before{content:"＋ "; color:var(--gold);}
details.about[open] summary::before{content:"－ ";}
details.about p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-top:8px;}

/* ---------- script lab ---------- */
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.letter-tile .lg{font-family:'Amiri',serif; font-size:30px; direction:rtl;}
.letter-tile .tr{font-size:11px; color:var(--ink-soft);}
.forms-row{display:flex; gap:8px; justify-content:space-between; margin-top:10px;}
.forms-row div{flex:1; text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 4px;}
.forms-row .f{font-family:'Amiri',serif; font-size:26px; direction:rtl;}
.forms-row .k{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}
canvas.trace{width:100%; touch-action:none; background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-sm);}

/* ---------- roots / vocab ---------- */
.root-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; text-align:center; cursor:pointer;}
.root-tile .letters{font-family:'Amiri',serif; font-size:26px; direction:rtl; letter-spacing:4px;}
.root-tile .gloss{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.word-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border);}
.word-row:first-of-type{border-top:none;}
.word-row .ar{font-size:19px; flex:1;}
.word-row .en{font-size:12.5px; color:var(--ink-soft); text-align:right; flex:none; max-width:38%;}

/* ---------- reading ---------- */
.passage-line{font-size:20px; line-height:2.2; direction:rtl;}
.tok{cursor:pointer; border-bottom:1.5px dotted var(--gold); padding:1px 2px; border-radius:3px;}
.tok:hover, .tok:focus{background:var(--gold-soft);}
.speaker{font-size:12px; color:var(--ink-soft); direction:ltr; font-weight:700; margin-top:8px;}
.gloss-pop{background:var(--ink); color:var(--bg); font-size:13px; padding:6px 10px; border-radius:8px; display:inline-block; margin:4px 0; font-family:'Karla',sans-serif;}

/* ---------- speaking ---------- */
.pair-row{display:flex; gap:10px;}
.word-btn{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; text-align:center;}
.word-btn.active{border-color:var(--gold); background:var(--gold-soft);}
.word-btn .ar{font-size:20px; display:block;}
.word-btn .tr{font-size:11.5px; color:var(--ink-soft);}
.practice-bar{position:sticky; bottom:calc(72px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}

/* ---------- bottom nav (phone) ---------- */
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border); padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); display:none;}
.bottomnav .row{display:flex; justify-content:space-around; max-width:760px; margin:0 auto;}
.bottomnav button{background:none; border:none; color:var(--ink-faint); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; font-weight:600;}
.bottomnav button .ic{font-size:18px;}
.bottomnav button.active{color:var(--gold);}
@media (max-width:640px){
  .bottomnav{display:block;}
  nav.tabs{display:none;}
}

/* ---------- overlays / modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(8,9,15,0.64); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:640px){ .overlay{align-items:center;} }
.sheet{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));}
@media (min-width:640px){ .sheet{border-radius:20px; max-height:85vh;} }
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.path-card{border:1.5px solid var(--border); border-radius:var(--radius); padding:16px; text-align:left; background:var(--surface); width:100%;}
.path-card h3{font-size:16px; margin-bottom:4px;}
.path-card p{font-size:13px; color:var(--ink-soft); margin:0;}
.path-card + .path-card{margin-top:10px;}

.review-card{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:8px 4px 18px;}
.review-card .kind{font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:.07em; font-weight:700;}
.review-card .ar-display{font-size:52px; line-height:1.3; margin:6px 0 2px;}
.audio-btn{width:52px; height:52px; border-radius:50%; border:1.5px solid var(--gold); background:var(--gold-soft); color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:20px; margin:2px 0 16px;}
.prompt-hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:4px;}
.choices{display:flex; flex-direction:column; gap:10px; width:100%;}
.choice-btn{width:100%; text-align:left; padding:15px 16px; border-radius:13px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15.5px; font-weight:600; font-family:'Karla',sans-serif; transition:background .15s,border-color .15s,opacity .15s;}
.choice-btn.correct{background:#0F8377; border-color:#0F8377; color:#fff;}
.choice-btn.wrong{background:#B8483A; border-color:#B8483A; color:#fff;}
.choice-btn.disabled{opacity:.4;}
.continue-btn{width:100%; margin-top:14px;}
.progress-track{height:5px; background:var(--surface-2); border-radius:99px; width:100%;}
.progress-fill{height:100%; background:var(--gold); border-radius:99px;}
</style>
</head>
<body>


<div id="shell">
  <header class="top">
    <div class="top-inner">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark">ر</div>
          <h1>Rooted Arabic</h1>
        </div>
        <div class="chips">
          <div class="chip" title="Day streak">🔥 <span id="streakChip">0</span></div>
          <div class="chip" title="Experience points">✦ <span id="xpChip">0</span></div>
        </div>
      </div>
      <nav class="tabs" id="tabsTop">
        <button data-tab="dashboard">Dashboard</button>
        <button data-tab="script">Script</button>
        <button data-tab="roots">Roots</button>
        <button data-tab="reading">Reading</button>
        <button data-tab="speak">Speak</button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="bottomnav">
  <div class="row" id="tabsBottom">
    <button data-tab="dashboard"><span class="ic">⌂</span>Home</button>
    <button data-tab="script"><span class="ic">أ</span>Script</button>
    <button data-tab="roots"><span class="ic">ج</span>Roots</button>
    <button data-tab="reading"><span class="ic">📖</span>Reading</button>
    <button data-tab="speak"><span class="ic">🎙</span>Speak</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =================== DATA =================== */

const LETTERS = [
 {id:'alif',name:'Alif',letter:'ا',initial:'ا',medial:'ا',final:'ـا',connects:false,translit:'ā / a',sound:'A long "aa" sound, like in "father". Also the seat for short vowels at the start of a word.',example:{ar:'كِتَاب',translit:'kitāb',meaning:'book'}},
 {id:'ba',name:'Bāʼ',letter:'ب',initial:'بـ',medial:'ـبـ',final:'ـب',connects:true,translit:'b',sound:'Like the "b" in "book".',example:{ar:'بَيْت',translit:'bayt',meaning:'house'}},
 {id:'ta',name:'Tāʼ',letter:'ت',initial:'تـ',medial:'ـتـ',final:'ـت',connects:true,translit:'t',sound:'Like the "t" in "top".',example:{ar:'تُفَّاح',translit:'tuffāḥ',meaning:'apple'}},
 {id:'tha',name:'Thāʼ',letter:'ث',initial:'ثـ',medial:'ـثـ',final:'ـث',connects:true,translit:'th',sound:'Like "th" in "think" — not "the".',example:{ar:'ثَعْلَب',translit:'thaʿlab',meaning:'fox'}},
 {id:'jim',name:'Jīm',letter:'ج',initial:'جـ',medial:'ـجـ',final:'ـج',connects:true,translit:'j',sound:'Like "j" in "jam" (in Egyptian speech, closer to a hard "g").',example:{ar:'جَمَل',translit:'jamal',meaning:'camel'}},
 {id:'haa',name:'Ḥāʼ',letter:'ح',initial:'حـ',medial:'ـحـ',final:'ـح',connects:true,translit:'ḥ',sound:'A breathy "h" pushed from deep in the throat — stronger than English "h" and different from ه.',example:{ar:'حَلِيب',translit:'ḥalīb',meaning:'milk'}},
 {id:'khaa',name:'Khāʼ',letter:'خ',initial:'خـ',medial:'ـخـ',final:'ـخ',connects:true,translit:'kh',sound:'Like the "ch" in Scottish "loch" or German "Bach".',example:{ar:'خُبْز',translit:'khubz',meaning:'bread'}},
 {id:'dal',name:'Dāl',letter:'د',initial:'د',medial:'د',final:'ـد',connects:false,translit:'d',sound:'Like "d" in "door".',example:{ar:'دَار',translit:'dār',meaning:'house / home'}},
 {id:'dhal',name:'Dhāl',letter:'ذ',initial:'ذ',medial:'ذ',final:'ـذ',connects:false,translit:'dh',sound:'Like "th" in "this" — not "think".',example:{ar:'ذَهَب',translit:'dhahab',meaning:'gold'}},
 {id:'ra',name:'Rāʼ',letter:'ر',initial:'ر',medial:'ر',final:'ـر',connects:false,translit:'r',sound:'A rolled or tapped "r", like Spanish "r".',example:{ar:'رُزّ',translit:'ruzz',meaning:'rice'}},
 {id:'zay',name:'Zāy',letter:'ز',initial:'ز',medial:'ز',final:'ـز',connects:false,translit:'z',sound:'Like "z" in "zoo".',example:{ar:'زَيْت',translit:'zayt',meaning:'oil'}},
 {id:'sin',name:'Sīn',letter:'س',initial:'سـ',medial:'ـسـ',final:'ـس',connects:true,translit:'s',sound:'Like "s" in "sun".',example:{ar:'سَمَك',translit:'samak',meaning:'fish'}},
 {id:'shin',name:'Shīn',letter:'ش',initial:'شـ',medial:'ـشـ',final:'ـش',connects:true,translit:'sh',sound:'Like "sh" in "shoe".',example:{ar:'شَمْس',translit:'shams',meaning:'sun'}},
 {id:'saad',name:'Ṣād',letter:'ص',initial:'صـ',medial:'ـصـ',final:'ـص',connects:true,translit:'ṣ',sound:'An "emphatic" s — say it with the back of the tongue pulled back and down. Deeper than س.',example:{ar:'صَبَاح',translit:'ṣabāḥ',meaning:'morning'}},
 {id:'daad',name:'Ḍād',letter:'ض',initial:'ضـ',medial:'ـضـ',final:'ـض',connects:true,translit:'ḍ',sound:'An "emphatic" d — like د but deeper, tongue pulled back.',example:{ar:'ضَوْء',translit:'ḍawʾ',meaning:'light'}},
 {id:'taa2',name:'Ṭāʼ',letter:'ط',initial:'طـ',medial:'ـطـ',final:'ـط',connects:true,translit:'ṭ',sound:'An "emphatic" t — deeper and more forceful than ت.',example:{ar:'طَاوِلَة',translit:'ṭāwila',meaning:'table'}},
 {id:'zaa2',name:'Ẓāʼ',letter:'ظ',initial:'ظـ',medial:'ـظـ',final:'ـظ',connects:true,translit:'ẓ',sound:'An emphatic version of ذ — deep and forceful.',example:{ar:'ظُهْر',translit:'ẓuhr',meaning:'noon'}},
 {id:'ain',name:'ʿAyn',letter:'ع',initial:'عـ',medial:'ـعـ',final:'ـع',connects:true,translit:'ʿ',sound:'A tight, voiced throat sound with no English equivalent — like the start of a swallow. Extremely common; worth practicing alone.',example:{ar:'عَيْن',translit:'ʿayn',meaning:'eye'}},
 {id:'ghain',name:'Ghayn',letter:'غ',initial:'غـ',medial:'ـغـ',final:'ـغ',connects:true,translit:'gh',sound:'A gargled sound, close to the French "r" in "rouge".',example:{ar:'غُرْفَة',translit:'ghurfa',meaning:'room'}},

/* =================== STATE =================== */
let state = null;
let dbNS = null, userNS = null, uid = null;
let currentTab = 'dashboard';
let saveTimer = null;

function defaultState(){
  return {track:null, onboarded:false, streak:0, xp:0, lastActiveDate:null, history:[], cards:{}, passagesRead:[], startDate:null};
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(d,n){ const dt=new Date(d+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); }
function formatMonthYear(d){ return new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'long', year:'numeric', timeZone:'UTC'}); }

async function initPersistence(){
  try{
    if(window.claude && window.claude.use){
      dbNS = await window.claude.use('db');
      userNS = await window.claude.use('user');
      if(dbNS && userNS){ uid = await userNS.id(); }
    }
  }catch(e){}
}
async function loadState(){
  let loaded = null;
  if(dbNS && uid){
    try{ const snap = await dbNS.doc('data/users/'+uid+'/state').get(); if(snap.exists) loaded = snap.data(); }catch(e){}
  }
  if(!loaded){
    try{ const raw = localStorage.getItem('rootedArabicState_v1'); if(raw) loaded = JSON.parse(raw); }catch(e){}
  }
  state = Object.assign(defaultState(), loaded||{});
  if(!state.cards) state.cards = {};
  if(!state.history) state.history = [];
  if(!state.passagesRead) state.passagesRead = [];
  if(state.onboarded && !state.startDate) state.startDate = todayStr();
}
function queueSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}
async function saveState(){
  try{ localStorage.setItem('rootedArabicState_v1', JSON.stringify(state)); }catch(e){}
  if(dbNS && uid){
    try{ await dbNS.doc('data/users/'+uid+'/state').set(state); }catch(e){}
  }
}

/* =================== SRS =================== */
function isDue(cardId){
  const c = state.cards[cardId];
  if(!c) return true;
  return c.due <= todayStr();
}
function cardStatus(cardId){
  const c = state.cards[cardId];
  if(!c || c.reps===0) return 'new';
  if(c.reps>=4 && c.ef>=2.3) return 'mastered';
  return 'learning';
}
function gradeCard(cardId, grade){
  const today = todayStr();
  let c = state.cards[cardId];
  if(!c) c = {ef:2.5, interval:0, reps:0, due:today, lastResult:null};
  if(grade==='again'){
    c.reps = 0; c.ef = Math.max(1.3, c.ef-0.2); c.interval = 0; c.due = today;
  } else {
    const delta = {hard:-0.15, good:0, easy:0.15}[grade];
    c.ef = Math.max(1.3, c.ef+delta);
    if(c.reps===0){ c.interval = grade==='hard'?1:(grade==='good'?1:3); }
    else if(c.reps===1){ c.interval = grade==='hard'?2:(grade==='good'?3:5); }
    else { c.interval = Math.round(Math.max(1,c.interval)*c.ef*(grade==='easy'?1.3:1)); }
    c.reps += 1;
    c.due = addDays(today, c.interval);
  }
  c.lastResult = grade; c.lastReviewed = today;
  state.cards[cardId] = c;
  bumpStreakAndXp(grade);
  queueSave();
}
function bumpStreakAndXp(grade){
  const today = todayStr();
  state.xp += grade==='again' ? 2 : 10;
  if(state.lastActiveDate !== today){
    const y = addDays(today,-1);
    state.streak = (state.lastActiveDate===y) ? state.streak+1 : 1;
    state.lastActiveDate = today;
    if(!state.history.includes(today)){ state.history.push(today); if(state.history.length>60) state.history=state.history.slice(-60); }
  }
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildSession(){
  const due = ALL_CARDS.filter(c=>state.cards[c.id] && isDue(c.id));
  const fresh = ALL_CARDS.filter(c=>!state.cards[c.id]);
  return shuffle([...due, ...shuffle(fresh).slice(0,10)]).map(c=>c.id);
}

/* =================== VOICE: TTS =================== */
let arabicVoice = null, voicesReady = false;
function loadVoices(){
  const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
  if(voices.length){
    arabicVoice = voices.find(v=>/^ar/i.test(v.lang)) || null;
    voicesReady = true;
  }
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function freshArabicVoice(){
  try{
    const voices = speechSynthesis.getVoices() || [];
    return voices.find(v=>/^ar/i.test(v.lang)) || null;
  }catch(e){ return null; }
}
function makeUtterance(text, rate){
  const voice = freshArabicVoice();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang = voice ? voice.lang : 'ar-SA';
  u.rate = rate || 0.82;
  u.onerror = (ev)=>{ if(ev.error!=='canceled' && ev.error!=='interrupted') toast('Audio didn\'t play — tap again.'); };
  return u;
}
function speak(text, rate){
  try{
    if(!('speechSynthesis' in window)){ toast('This browser can\'t play audio out loud.'); return false; }
    speechSynthesis.resume();
    speechSynthesis.cancel();
    const u = makeUtterance(text, rate);
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} }, 30);
    return true;
  }catch(e){ return false; }
}
function speakRepeat(text, times, rate){
  try{
    if(!('speechSynthesis' in window)){ toast('This browser can\'t play audio out loud.'); return false; }
    speechSynthesis.resume();
    speechSynthesis.cancel();
    setTimeout(()=>{
      try{ for(let i=0;i<times;i++) speechSynthesis.speak(makeUtterance(text, rate)); }catch(e){}
    }, 30);
    return true;
  }catch(e){ return false; }
}

function stripAr(s){ return (s||'').replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/[ىة]/g,c=>c==='ة'?'ه':'ي').replace(/\s|[.,!؟?،]/g,''); }

/* =================== UI HELPERS =================== */
function toast(msg){
  const el = document.getElementById('toastRoot');
  el.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(()=>{ if(el.firstChild) el.innerHTML=''; }, 2600);
}
function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusPill(cardId){
  const s = cardStatus(cardId);
  const label = s==='new'?'New':s==='learning'?'Learning':'Mastered';
  return '<span class="pill '+s+'">'+label+'</span>';
}
window.speakBtn = function(text){ speak(text); };

const PHASE_DEFS = [
 {key:'foundations', title:'Foundations', desc:'Learn the letters and connect the sounds you already know to the script.',
   target:'28 of 31 letters practiced', pct:()=>Math.min(1, lettersIntroducedCount()/28), done:()=>lettersIntroducedCount()>=28},
 {key:'vocab', title:'Core vocabulary', desc:'Build a working vocabulary through roots — enough to recognize most of what you hear.',
   target:'80% of words & phrases introduced', pct:()=>Math.min(1, vocabPhraseIntroducedPct()/0.8), done:()=>vocabPhraseIntroducedPct()>=0.8},
 {key:'reading', title:'Reading & listening', desc:'Read graded passages and shadow native audio until whole sentences click.',
   target:'All 3 passages read', pct:()=>readingPct(), done:()=>readingPct()>=1},
 {key:'conversation', title:'Conversation', desc:'Combine what you know in real exchanges — greetings, family, daily life — out loud.',
   target:'Ongoing — daily shadowing & speaking practice', pct:()=>{
     const others=[PHASE_DEFS[0],PHASE_DEFS[1],PHASE_DEFS[2]]; return others.reduce((s,p)=>s+p.pct(),0)/3;
   }, done:()=>false},
];
function programMeta(track){
  const totalWeeks = track==='beginner' ? 24 : track==='some' ? 8 : 12;
  const label = track==='beginner' ? '~5–6 months' : track==='some' ? '~2 months' : '~3 months';
  const bounds = [0,0.15,0.5,0.8,1];
  const ranges = bounds.slice(0,4).map((b,i)=>{
    const start = Math.max(1, Math.round(totalWeeks*b)+1);
    const end = Math.round(totalWeeks*bounds[i+1]);
    return (i===3) ? ('Week '+start+'+') : (end>start ? ('Weeks '+start+'–'+end) : ('Week '+start));
  });
  return {totalWeeks, label, ranges};
}
function currentPhaseIndex(){ for(let i=0;i<PHASE_DEFS.length-1;i++){ if(!PHASE_DEFS[i].done()) return i; } return PHASE_DEFS.length-1; }
function renderRoadmap(){
  const track = state.track || 'some';
  const meta = programMeta(track);
  const cur = currentPhaseIndex();
  const targetDate = state.startDate ? addDays(state.startDate, meta.totalWeeks*7) : null;
  const rows = PHASE_DEFS.map((p,i)=>{
    const done = p.done(); const isCurrent = i===cur && !done;
    const pct = Math.round(p.pct()*100);
    return `<div class="phase-row ${done?'done':''} ${isCurrent?'current':''}">
      <div class="phase-num">${done?'✓':(i+1)}</div>
      <div class="phase-body">
        <div class="phase-head"><h3>${p.title}${isCurrent?'<span class="here-badge">You are here</span>':''}</h3><span class="phase-week">${meta.ranges[i]}</span></div>
        <div class="phase-desc">${p.desc}</div>
        <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="phase-target">${p.target}</div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="card">
    <div class="section-title"><h2 style="font-size:17px;">Your path to conversation</h2><span class="muted" style="font-size:12px;">${meta.label}</span></div>
    <p class="muted" style="font-size:13px; margin-top:2px;">A realistic sequence, not a countdown — paced for ${track==='beginner'?'starting from zero':track==='some'?'building on what you already studied':'a heritage learner’s head start'} at roughly 15–20 minutes a day.${targetDate?' On track for basic conversation around <b style="color:var(--ink);">'+formatMonthYear(targetDate)+'</b> if you keep a steady pace.':''}</p>
    <div class="roadmap" style="margin-top:6px;">${rows}</div>
  </div>`;
}

function renderDashboard(){

    <div class="stat-tile"><div class="num">${wordsLearned}/${ALL_CARDS.filter(c=>c.kind==='vocab').length}</div><div class="lbl">Words</div></div>
    <div class="stat-tile"><div class="num">${phrasesLearned}/${PHRASES.length}</div><div class="lbl">Phrases</div></div>
  </div>
  <div class="card">
    <details class="about">
      <summary>Why this app works the way it does</summary>

function openLetter(id){

  showModal(letterDetailHtml(l));

function setupTrace(letter){
  const cv = document.getElementById('traceCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  function size(){ cv.width = cv.clientWidth*2; cv.height = cv.clientHeight*2; ctx.scale(2,2); draw(); }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.direction='rtl'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = '80px Amiri, serif';
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-faint');
    ctx.globalAlpha=0.35;
    ctx.fillText(letter, cv.clientWidth/2, cv.clientHeight/2);
    ctx.globalAlpha=1;
  }
  size();
  let drawing=false;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold');
  ctx.lineWidth=3; ctx.lineCap='round';
  function pos(e){ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
  function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing=false; }
  cv.onmousedown=start; cv.onmousemove=move; window.addEventListener('mouseup',end);
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
  cv._redraw = draw;
}
window.clearTrace = function(){ const cv=document.getElementById('traceCanvas'); if(cv && cv._redraw) cv._redraw(); };

function openLetterQuiz(){
  const pool = shuffle([...PHRASES.map(p=>p.ar), ...ROOTS.flatMap(r=>r.words.map(w=>w.ar))]);
  quizState = {i:0, correct:0, pool: pool.slice(0,8)};
  renderLetterQuiz();
}
let quizState = null;
function renderLetterQuiz(){
  if(quizState.i >= quizState.pool.length){
    showModal(`<div class="sheet-head"><h3>Letter match — done</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>
      <p style="text-align:center; font-size:16px; margin-top:20px;">${quizState.correct} / ${quizState.pool.length} correct</p>
      <div class="btn-row" style="justify-content:center; margin-top:16px;"><button class="btn primary" onclick="openLetterQuiz()">Play again</button></div>`);
    return;
  }
  const word = quizState.pool[quizState.i];
  const firstChar = stripAr(word)[0];
  const correctId = CHAR_TO_LETTER[firstChar] || CHAR_TO_LETTER[word.replace(/[\u064B-\u0652\u0670]/g,'')[0]];
  const options = shuffle([correctId, ...shuffle(LETTERS.map(l=>l.id).filter(id=>id!==correctId)).slice(0,3)]);
  showModal(`<div class="sheet-head"><h3>Letter match ${quizState.i+1}/${quizState.pool.length}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>
    <div style="text-align:center; margin:18px 0;">
      <button class="iconbtn" style="width:56px; height:56px; font-size:22px; margin:0 auto;" onclick="speakBtn('${word}')">🔊</button>
      <p class="muted" style="margin-top:10px; font-size:13px;">Tap to hear the word, then pick its first letter.</p>
    </div>
    <div class="grid cols-4">${options.map(id=>{const l=LETTERS.find(x=>x.id===id); return `<button class="letter-tile" onclick="answerLetterQuiz('${id}','${correctId}')"><span class="lg">${l.letter}</span></button>`;}).join('')}</div>`);
}
window.answerLetterQuiz = function(picked, correct){
  if(picked===correct){ quizState.correct++; toast('Correct 🎉'); } else { toast('It was '+LETTERS.find(l=>l.id===correct).letter); }
  quizState.i++;
  setTimeout(renderLetterQuiz, 500);
};

/* =================== REVIEW SESSION (multiple choice) =================== */
let session = null;
function choiceLabel(c){ return c.kind==='letter' ? c.data.translit+' — '+c.data.name : c.meaning; }
function buildChoices(card){
  const poolSource = card.kind==='letter' ? LETTERS.filter(l=>l.id!==card.data.id).map(l=>({kind:'letter',data:l})) : ALL_CARDS.filter(c=>c.kind===card.kind && c.id!==card.id);
  const labels = Array.from(new Set(poolSource.map(choiceLabel)));
  const distractors = shuffle(labels).slice(0,3);
  return shuffle([{label:choiceLabel(card), correct:true}, ...distractors.map(l=>({label:l, correct:false}))]);
}
function openReview(){
  const ids = buildSession();
  if(!ids.length){ toast('Nothing due right now — nice work.'); return; }
  session = {ids, i:0, total: ids.length, choicesFor:-1, choices:[], answered:false, pickedIdx:null};
  renderReview();
}
function extraDetail(card){
  if(card.kind==='letter'){
    const l = card.data;
    return `<div class="forms-row" style="width:100%;"><div><div class="f">${l.initial}</div><div class="k">Initial</div></div><div><div class="f">${l.medial}</div><div class="k">Medial</div></div><div><div class="f">${l.final}</div><div class="k">Final</div></div></div>
      <p style="font-size:13px; color:var(--ink-soft); text-align:left; margin-top:8px;">${l.sound}</p>`;
  }
  if(card.kind==='phrase' && card.data.note) return `<p style="font-size:13px; color:var(--ink-soft); text-align:left;">${card.data.note}</p>`;
  if(card.kind==='vocab') return `<p style="font-size:13px; color:var(--ink-soft); text-align:left;">Root: ${card.data.root.letters.join(' ')} — ${card.data.root.meaning}</p>`;
  return '';
}
function renderReview(){
  if(!session || session.i>=session.ids.length){
    showModal(`<div style="text-align:center; padding:30px 10px;"><h3 style="font-family:'Fraunces',serif; font-size:20px;">Session complete</h3><p class="muted" style="margin-top:8px;">You reviewed ${session?session.total:0} cards.</p><button class="btn primary" style="margin-top:16px;" onclick="closeModal()">Done</button></div>`);
    session = null;
    return;
  }
  const card = CARD_BY_ID[session.ids[session.i]];
  if(session.choicesFor !== session.i){
    session.choices = buildChoices(card);
    session.choicesFor = session.i;
    session.answered = false;
    session.pickedIdx = null;
    speak(card.ar);
  }
  const pct = Math.round((session.i/session.total)*100);
  const kindLabel = card.kind==='letter'?'Letter':card.kind==='vocab'?'Word':'Phrase';
  const arSize = card.kind==='letter'?'64px':card.kind==='phrase'?'38px':'46px';
  const optionsHtml = session.choices.map((opt,idx)=>{
    let cls = 'choice-btn';
    if(session.answered){ if(opt.correct) cls+=' correct'; else if(idx===session.pickedIdx) cls+=' wrong'; else cls+=' disabled'; }
    return `<button class="${cls}" ${session.answered?'disabled':''} onclick="answerChoice(${idx})">${escapeHtml(opt.label)}</button>`;
  }).join('');
  showModal(`
  <div class="sheet-head"><span class="muted" style="font-size:12px;">${session.i+1} / ${session.total}</span><button class="iconbtn" onclick="endReview()">✕</button></div>
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
  <div class="review-card">
    <div class="kind">${kindLabel}</div>
    <div class="ar-display" style="font-size:${arSize};">${card.ar}</div>
    <button class="audio-btn" onclick="speakBtn('${card.ar.replace(/'/g,"\\'")}')">🔊</button>
    ${!session.answered ? '<p class="prompt-hint">Listen, then pick what it means.</p>' : ''}
    <div class="choices">${optionsHtml}</div>
    ${session.answered ? `<div style="width:100%; margin-top:14px; text-align:left;">${extraDetail(card)}</div><button class="btn primary continue-btn" onclick="nextReviewCard()">Continue</button>` : ''}
  </div>`);
}
function answerChoice(idx){
  if(!session || session.answered) return;
  const opt = session.choices[idx];
  session.answered = true;
  session.pickedIdx = idx;
  gradeCard(session.ids[session.i], opt.correct ? 'good' : 'again');
  renderTopChips();
  renderReview();
}
function nextReviewCard(){ session.i++; renderReview(); }
function endReview(){ session=null; closeModal(); render(); }

/* =================== ONBOARDING =================== */
function onboardingHtml(){
  return `
  <div class="sheet-head"><h3 style="font-family:'Fraunces',serif; font-size:20px;">Marḥaba — welcome</h3></div>
  <p style="font-size:14px; color:var(--ink-soft); line-height:1.55; margin-bottom:14px;">Tell us where you're starting from so the app can point you the right direction. Everything stays unlocked either way.</p>
  <button class="path-card" onclick="choosePath('heritage')"><h3>I grew up around Arabic</h3><p>I understand spoken Arabic and know basic phrases, but I can't really read or write the script.</p></button>
  <button class="path-card" onclick="choosePath('beginner')"><h3>Complete beginner</h3><p>I don't know the alphabet or vocabulary yet — starting from zero.</p></button>
  <button class="path-card" onclick="choosePath('some')"><h3>Some formal study</h3><p>I've studied Arabic before and know some grammar and vocabulary.</p></button>
  <p class="muted" style="font-size:12px; margin-top:14px; text-align:center;">Content is tuned for Levantine Arabic alongside Modern Standard Arabic (MSA).</p>`;
}
function choosePath(track){
  state.track = track; state.onboarded = true;
  if(!state.startDate) state.startDate = todayStr();
  queueSave();
  closeModal(); render();
}

/* =================== MODAL / ROUTER =================== */
function showModal(inner){
  document.getElementById('modalRoot').innerHTML = '<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="sheet">'+inner+'</div></div>';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
window.openReview=openReview; window.renderReview=renderReview; window.answerChoice=answerChoice; window.nextReviewCard=nextReviewCard; window.endReview=endReview;
window.openLetter=openLetter; window.closeModal=closeModal; window.openLetterQuiz=openLetterQuiz;
window.openRoot=openRoot; window.openPassage=openPassage; window.choosePath=choosePath;
window.pickTarget=pickTarget; window.pickTargetTrio=pickTargetTrio; window.pickTargetPhrase=pickTargetPhrase;
window.setTab = function(tab){ currentTab = tab; render(); };

function renderTopChips(){
  document.getElementById('streakChip').textContent = state.streak;
  document.getElementById('xpChip').textContent = state.xp;
}
function renderTabs(){
  [['tabsTop','button'],['tabsBottom','button']].forEach(([id])=>{
    document.querySelectorAll('#'+id+' button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===currentTab);
      b.onclick = ()=>setTab(b.dataset.tab);
    });
  });
}
function render(){
  renderTopChips(); renderTabs();
  const main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='script') main.innerHTML = renderScript();
  else if(currentTab==='roots') main.innerHTML = renderRoots();
  else if(currentTab==='reading') main.innerHTML = renderReading();
  else if(currentTab==='speak') main.innerHTML = renderSpeaking();
  if(!state.onboarded) showModal(onboardingHtml());
}

/* =================== INIT =================== */
async function start(){
  await initPersistence();
  await loadState();
  render();
  if('speechSynthesis' in window){
    setTimeout(()=>{ if(!arabicVoice) toast('No Arabic voice found on this device — audio playback may be silent. Chrome on desktop usually works best.'); }, 1200);
  }
}
start();
</script>
